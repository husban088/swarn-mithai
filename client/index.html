<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="description" content="Order online with cash on delivery." />
    <title>Loading…</title>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts non-blocking: internet/DNS slow ya band ho to bhi page white nahi rehta -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    /></noscript>
    <style>
      body {
        margin: 0;
      }
      #boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #17171b;
        color: #bfdcfa;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      #boot i {
        display: block;
        width: 44px;
        height: 44px;
        margin: 0 auto 14px;
        border: 3px solid rgba(191, 220, 250, 0.25);
        border-top-color: #4aa3f0;
        border-radius: 50%;
        animation: bootspin 0.8s linear infinite;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div><i></i>Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
