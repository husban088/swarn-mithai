<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="Special Box">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="1" stop-color="#f0dcb4"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6df9b"/>
      <stop offset="0.5" stop-color="#c9973a"/>
      <stop offset="1" stop-color="#8f6420"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a1018"/>
      <stop offset="1" stop-color="#4d070d"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b0b13"/>
      <stop offset="1" stop-color="#3b0509"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3161f"/>
      <stop offset="1" stop-color="#7d0d15"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#3b2a08" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="#c9973a" stroke-opacity="0.35" stroke-width="2">
    <rect x="36" y="36" width="828" height="828" rx="28"/>
    <rect x="52" y="52" width="796" height="796" rx="20" stroke-opacity="0.2"/>
  </g>
  <ellipse cx="450" cy="742" rx="250" ry="26" fill="#3b2a08" opacity="0.22"/>
  <g filter="url(#sh)">
    <!-- box body -->
    <rect x="200" y="430" width="500" height="290" rx="14" fill="url(#boxFront)"/>
    <rect x="200" y="430" width="500" height="26" fill="#000" opacity="0.18"/>
    <!-- vertical ribbon -->
    <rect x="418" y="430" width="64" height="290" fill="url(#gold)"/>
    <rect x="418" y="430" width="64" height="290" fill="#fff" opacity="0.08"/>
    <!-- lid -->
    <rect x="170" y="352" width="560" height="96" rx="16" fill="url(#lid)"/>
    <rect x="170" y="352" width="560" height="14" rx="7" fill="#fff" opacity="0.14"/>
    <rect x="418" y="352" width="64" height="96" fill="url(#gold)"/>
    <!-- bow -->
    <path d="M450 352 C 360 250, 262 262, 292 330 C 312 372, 410 362, 450 352 Z" fill="url(#gold)" stroke="#8f6420" stroke-width="3"/>
    <path d="M450 352 C 540 250, 638 262, 608 330 C 588 372, 490 362, 450 352 Z" fill="url(#gold)" stroke="#8f6420" stroke-width="3"/>
    <path d="M450 352 C 410 392, 372 470, 360 520 L 400 500 Z" fill="url(#gold)" stroke="#8f6420" stroke-width="3"/>
    <path d="M450 352 C 490 392, 528 470, 540 520 L 500 500 Z" fill="url(#gold)" stroke="#8f6420" stroke-width="3"/>
    <circle cx="450" cy="352" r="30" fill="url(#gold)" stroke="#8f6420" stroke-width="3"/>
    <circle cx="440" cy="342" r="9" fill="#fff" opacity="0.45"/>
  </g>
  <!-- label -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="450" y="140" font-size="30" letter-spacing="10" fill="#8f6420">MITHAI HOUSE</text>
    <text x="450" y="214" font-size="76" font-weight="700" fill="#4d070d">Special Box</text>
  </g>
  <g fill="#c9973a">
    <path d="M225 600 l9 -9 l9 9 l-9 9z"/><path d="M657 600 l9 -9 l9 9 l-9 9z"/>
    <path d="M225 650 l7 -7 l7 7 l-7 7z"/><path d="M661 650 l7 -7 l7 7 l-7 7z"/>
  </g>
  <text x="450" y="800" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#6b4a14">Weddings · Birthdays · Baby Born</text>
</svg>
